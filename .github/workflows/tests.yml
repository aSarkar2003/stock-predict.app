name: CI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: stock_predict
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Initialize roles and migrate
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: stock_predict
          PGUSER_ADMIN: postgres
          PGPASSWORD_ADMIN: admin
          PGUSER_OWNER: app_owner
          PGPASSWORD_OWNER: app_owner_pass
          PGUSER_RW: app_rw
          PGPASSWORD_RW: app_rw_pass
          PGUSER_RO: app_ro
          PGPASSWORD_RO: app_ro_pass
        run: |
          python db/init_roles.py
          python db/migrate.py
          python db/seed.py

      - name: Run pytest test suite
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: stock_predict
          PGUSER_ADMIN: postgres
          PGPASSWORD_ADMIN: admin
          PGUSER_OWNER: app_owner
          PGPASSWORD_OWNER: app_owner_pass
          PGUSER_RW: app_rw
          PGPASSWORD_RW: app_rw_pass
          PGUSER_RO: app_ro
          PGPASSWORD_RO: app_ro_pass
        run: |
          pytest -v

